name: Python SDK pre-merge tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pykinisi
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: pykinisi
          persist-credentials: false

      - name: Check out the matching public firmware
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: szolotykh/kinisi-motor-controller-firmware
          ref: ac4ccef34ca0be8da119dbaaf23e41c6ae22f386
          path: kinisi-motor-controller-firmware
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install SDK test dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify generated commands and board profiles against firmware
        run: |
          python tools/update-commands.py --schema ../kinisi-motor-controller-firmware/commands.json --check
          python tools/update-board-profiles.py --profiles ../kinisi-motor-controller-firmware/include/board_profiles.json --check

      - name: Run SDK and native firmware interoperability tests
        env:
          CC: gcc
        run: |
          python - <<'PY'
          import unittest

          loader = unittest.defaultTestLoader
          native = loader.discover("tests", pattern="test_firmware_integration.py")
          if native.countTestCases() == 0:
              raise SystemExit("Missing native firmware interoperability tests")
          suite = loader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or not result.testsRun or result.skipped:
              raise SystemExit("SDK tests failed, were absent, or were skipped")
          PY
